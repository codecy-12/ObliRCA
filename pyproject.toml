[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obli-rca"
version = "0.1.0"
description = "Security-obligation-driven post-deployment source-level root-cause analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ObliRCA maintainers"}]
dependencies = [
  "PyYAML>=6.0",
  "networkx>=3.1",
]

[project.optional-dependencies]
mysql = ["pymysql>=1.1"]
symbolic = ["angr>=9.2"]
joern = ["requests>=2.31"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
obli-rca = "obli_rca.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
