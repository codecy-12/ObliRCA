conditions:
  pre:
  - untrusted input is parsed, decoded, or passed to an interpreter
  must:
  - the input is normalized and constrained to the expected grammar before use
  stage:
  - before parsing, decoding, or command construction
  scope:
  - until the value is consumed; recheck after a second decoding or concatenation
query_manual:
- id: Q1
  what: Where is the input decoded or normalized?
  where: trace decoders, encoders, and transformations
  interpret: a normalization that matches the expected grammar answers the question
  next: continue if the representation is stable
- id: Q2
  what: Does the parser accept metacharacters or alternate syntax?
  where: inspect the parser grammar and separators
  interpret: a parser that rejects or escapes them answers the question
  next: record a gap if the grammar is permissive
- id: Q3
  what: Can a second decode change the value after validation?
  where: inspect repeated decoding and concatenation
  interpret: a validation after the last decode answers the question
  next: continue if the value is final
- id: Q4
  what: Is the input checked for type and length?
  where: trace the type and length into the consumer
  interpret: a check that covers the consumer's expectation answers the question
  next: record a gap if the consumer assumes an unchecked type
- id: Q5
  what: Does the sanitizer preserve the original meaning?
  where: compare the sanitized and consumed values
  interpret: a sanitizer that preserves the intended value answers the question
  next: continue if the value is not corrupted
