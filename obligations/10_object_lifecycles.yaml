conditions:
  pre:
  - an object is created, referenced, or destroyed
  must:
  - the object remains valid for every use and is destroyed only when no references
    remain
  stage:
  - before each use and before destruction
  scope:
  - until the last reference is released; recheck after reentrancy, callback, or error
query_manual:
- id: Q1
  what: Where is the object initialized?
  where: trace allocation and initialization
  interpret: a fully initialized object before publication answers the question
  next: continue if initialization is complete
- id: Q2
  what: Who holds references and for how long?
  where: trace references, aliases, and ownership
  interpret: a reference count or ownership rule that covers every use answers the
    question
  next: record a gap if a reference can outlive the object
- id: Q3
  what: Can a callback or reentrant path use the object after destruction?
  where: inspect callbacks, deferred work, and error paths
  interpret: a lifetime guard that covers the callback answers the question
  next: continue if the callback is safe
- id: Q4
  what: Is destruction ordered after the last use?
  where: inspect destruction and publication order
  interpret: a last-use-before-destroy order answers the question
  next: record a gap if destruction can precede a use
- id: Q5
  what: Is a failed initialization cleaned up?
  where: inspect partial initialization and rollback
  interpret: a cleanup that matches every partial state answers the question
  next: continue if rollback is complete
