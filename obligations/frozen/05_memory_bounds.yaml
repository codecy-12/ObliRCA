conditions:
  pre:
  - a read, write, copy, or index operation uses an externally influenced length or
    offset
  must:
  - the accessed range lies within the allocated or valid range of the same object
  stage:
  - before the memory operation
  scope:
  - until the operation completes; recheck after reallocation, length update, or aliasing
query_manual:
- id: Q1
  what: Where does the length or offset come from?
  where: trace the value from its source into the operation
  interpret: a value derived from a checked range answers the question
  next: continue if the origin is established
- id: Q2
  what: What is the valid range of the target?
  where: trace allocation, capacity, and updates
  interpret: a capacity that dominates the operation answers the question
  next: record a gap if the capacity is stale or unknown
- id: Q3
  what: Can the length arithmetic overflow or wrap?
  where: inspect additions, multiplications, and casts before the check
  interpret: an overflow-safe check answers the question
  next: continue if the arithmetic is bounded
- id: Q4
  what: Does the check use the same object and representation?
  where: compare the checked object with the operated object
  interpret: a check on the same object and representation answers the question
  next: record a gap if the check is on a copy or alias
- id: Q5
  what: Can the range change after the check?
  where: inspect reallocation, concurrent updates, and callbacks
  interpret: a stable range or recheck answers the question
  next: continue if the range is protected
