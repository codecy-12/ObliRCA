conditions:
  pre:
  - a message is accepted on an existing or new session
  must:
  - the message is valid for the current protocol state and the negotiated version
  stage:
  - before the message is dispatched or a state transition is committed
  scope:
  - until the transition is committed; recheck after retry, resumption, or renegotiation
query_manual:
- id: Q1
  what: Which state transition does this message require?
  where: trace the state variable and the transition table
  interpret: a transition guard that covers the message answers the question
  next: continue if the transition is valid
- id: Q2
  what: Is the negotiated version part of the check?
  where: trace version negotiation and feature flags
  interpret: a check that uses the negotiated version answers the question
  next: record a gap if a version-dependent feature is unchecked
- id: Q3
  what: Can a resumed or retried session skip the transition?
  where: inspect resumption, retry, and replay paths
  interpret: a resumption path that revalidates state answers the question
  next: continue if the state is reestablished
- id: Q4
  what: Can messages arrive out of order?
  where: inspect queues, demultiplexing, and sequence numbers
  interpret: an ordering rule that is enforced answers the question
  next: record a gap if reordering is accepted
- id: Q5
  what: Does the state update commit before the side effect?
  where: inspect the order of state write and dispatch
  interpret: a commit-before-dispatch order answers the question
  next: continue if the side effect is after the commit
