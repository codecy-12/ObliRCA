conditions:
  pre:
  - a request can consume a shared or bounded resource
  must:
  - the requested amount plus current consumption stays within the configured bound
  stage:
  - before allocation, enqueue, or admission
  scope:
  - until the resource is released or the request completes
query_manual:
- id: Q1
  what: Where is the bound configured?
  where: trace the quota or limit from configuration to the admission point
  interpret: a bound that is read by the admission check answers the question
  next: continue if the bound is established
- id: Q2
  what: Is current consumption accounted for atomically?
  where: inspect counters, reservations, and concurrent updates
  interpret: an atomic reservation answers the question
  next: record a gap if the check races with consumption
- id: Q3
  what: Can the request exceed the bound after a retry or split?
  where: trace retries, batches, and decomposition
  interpret: accounting that covers all parts answers the question
  next: continue if the whole request is accounted
- id: Q4
  what: Is the resource released on every error path?
  where: inspect rollback, cleanup, and exception paths
  interpret: a release that matches every acquisition answers the question
  next: record a gap if an error path leaks the reservation
- id: Q5
  what: Does the bound reset or expire correctly?
  where: inspect timers, windows, and reset logic
  interpret: a reset that preserves the invariant answers the question
  next: continue if the window is well defined
