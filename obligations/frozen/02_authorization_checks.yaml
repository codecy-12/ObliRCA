conditions:
  pre:
  - a request reaches a protected operation
  must:
  - the authenticated subject and its granted scope cover the requested action on
    the actual target
  stage:
  - before the protected operation is performed
  scope:
  - until the operation completes; recheck after identity, host, tenant, or policy
    changes
query_manual:
- id: Q1
  what: Where does the authentication result originate?
  where: trace the credential verification and the value it produces
  interpret: a result that is bound to the actual subject and context answers the
    question
  next: continue if the result is available
- id: Q2
  what: Is the subject bound to the requested action and target?
  where: trace subject, action, and target into the policy decision
  interpret: a decision that uses all three answers the question
  next: record a gap if one is substituted or omitted
- id: Q3
  what: Does the policy apply to the actual host or tenant?
  where: compare the policy context with the runtime context
  interpret: a consistency check before the decision answers the question
  next: continue if the contexts are checked
- id: Q4
  what: Can the policy version change between check and use?
  where: inspect reloads, caches, and deferred decisions
  interpret: a stable snapshot or recheck answers the question
  next: record a gap if the decision is stale
- id: Q5
  what: Is an upstream check sufficient for this target?
  where: trace callers and wrappers into the protected operation
  interpret: a dominating upstream check with the same context answers the question
  next: reassess sufficiency if only a partial check exists
