id: OBL-AUTH-001
category: Authorization Checks
category_id: 2
version: 1.0.0
summary: The authenticated subject and its granted scope must cover the requested
  action on the actual target.
roles:
  source:
    name: subject
    description: authenticated subject or client identity
    kind: object
  value:
    name: credential
    description: authentication result or granted scope
    kind: value
  target:
    name: action
    description: requested operation and target object
    kind: object
  policy:
    name: policy_context
    description: policy, host, or tenant context
    kind: object
  aux:
    name: policy_engine
    description: authorization or policy evaluation routine
    kind: object
