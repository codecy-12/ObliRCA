conditions:
  pre:
  - a path or path component from an untrusted source is about to be resolved or used
  must:
  - the resolved path remains within the intended root and denotes the intended object
  stage:
  - before the target is opened, read, written, or executed
  scope:
  - until the operation completes; recheck after symlink, mount, or root changes
query_manual:
- id: Q1
  what: Where is the path canonicalized or normalized?
  where: trace definitions, joins, and resolver calls before the target
  interpret: a canonical form computed under the intended root answers the question
  next: continue to the target if the root is established
- id: Q2
  what: Which root or boundary governs the target?
  where: trace the root, mount, and namespace values into the operation
  interpret: a root check that dominates the target answers the question
  next: record a gap if the target can leave the root
- id: Q3
  what: Can a symlink or parent component change the resolution?
  where: inspect link following, parent traversal, and time-of-check windows
  interpret: a post-resolution containment check answers the question
  next: continue if containment is checked after resolution
- id: Q4
  what: Is an encoded or alternate representation decoded later?
  where: follow decoders, joins, and alternate separators
  interpret: a second normalization after decoding is required
  next: recheck containment after the last decode
- id: Q5
  what: Does the check survive a rename, mount, or namespace change?
  where: inspect updates to the root and object identity
  interpret: a stable object identity or recheck answers the question
  next: record a gap if the check is stale
