conditions:
  pre:
  - two or more actors can access shared state concurrently
  must:
  - the read-modify-write sequence is atomic with respect to all conflicting accesses
  stage:
  - before the first access in the critical sequence
  scope:
  - until the sequence commits; recheck after lock release, retry, or reentrancy
query_manual:
- id: Q1
  what: Which accesses conflict with the sequence?
  where: enumerate readers, writers, and callbacks on the shared state
  interpret: a lock or atomic primitive that covers all conflicting accesses answers
    the question
  next: continue if the critical section is complete
- id: Q2
  what: Is the check and the use in the same critical section?
  where: trace the check, the use, and the lock boundaries
  interpret: a check that remains valid until the use answers the question
  next: record a gap if the check can be invalidated
- id: Q3
  what: Can a retry or callback reenter the sequence?
  where: inspect reentrancy and deferred work
  interpret: a reentrancy-safe primitive answers the question
  next: continue if reentrancy is excluded
- id: Q4
  what: Is the ordering visible to all actors?
  where: inspect memory barriers and publication
  interpret: a barrier or atomic publication answers the question
  next: record a gap if publication is unordered
- id: Q5
  what: Does an error path release the lock correctly?
  where: inspect unwind, timeout, and cancellation
  interpret: a release that matches every acquisition answers the question
  next: continue if the error path is safe
