conditions:
  pre:
  - a security-relevant option is absent, inherited, or left at its default
  must:
  - the effective configuration is deny-by-default and consistent with the deployment
    policy
  stage:
  - before the option is applied to the protected operation
  scope:
  - until the configuration is reloaded; recheck after inheritance, merge, or override
query_manual:
- id: Q1
  what: What is the default value and who applies it?
  where: trace the option definition and default assignment
  interpret: a deny-by-default value answers the question
  next: continue if the default is secure
- id: Q2
  what: Which precedence order applies?
  where: inspect merge and override rules
  interpret: an order that preserves the secure value answers the question
  next: record a gap if an override silently weakens it
- id: Q3
  what: Can inheritance introduce an unsafe value?
  where: trace parent, tenant, or profile inheritance
  interpret: an inheritance check that rejects unsafe values answers the question
  next: continue if inherited values are validated
- id: Q4
  what: Is the option applied to the actual deployment context?
  where: compare the option with the runtime context
  interpret: a context-aware check answers the question
  next: record a gap if the option is applied blindly
- id: Q5
  what: Does a reload restore the secure value?
  where: inspect reload and rollback paths
  interpret: a reload that revalidates the policy answers the question
  next: continue if the reload is safe
