conditions:
  pre:
  - a resource is acquired, transferred, or released
  must:
  - every acquired resource is released exactly once by a valid owner
  stage:
  - before acquisition and at every transfer or error path
  scope:
  - until the resource is destroyed; recheck after fork, duplication, or exception
query_manual:
- id: Q1
  what: Where is the resource acquired?
  where: trace acquisition and the resulting handle
  interpret: a handle with a clear owner answers the question
  next: continue if ownership is established
- id: Q2
  what: Who owns the resource after each transfer?
  where: trace transfers, duplication, and callbacks
  interpret: a single valid owner at each point answers the question
  next: record a gap if ownership is ambiguous
- id: Q3
  what: Is the resource released on every error path?
  where: inspect unwind, timeout, and cancellation
  interpret: a release that matches every acquisition answers the question
  next: continue if all paths release
- id: Q4
  what: Can the resource be released twice?
  where: inspect aliases, callbacks, and idempotency
  interpret: a release that is exactly once answers the question
  next: record a gap if double release is possible
- id: Q5
  what: Does the release order respect dependencies?
  where: inspect nested resources and destruction order
  interpret: a dependency-safe order answers the question
  next: continue if the order is safe
